version: '3.8'

services:
  # Main application
  civic-notices:
    build:
      context: .
      dockerfile: Dockerfile
    image: civicnotices:latest
    container_name: civic-notices-app
    restart: unless-stopped
    ports:
      - "5173:5173"  # Frontend
      - "5174:5174"  # API
    environment:
      NODE_ENV: production
      PORT: 5174
      DATABASE_URL: ${DATABASE_URL}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@civicnotices.co.uk}
      JWT_SECRET: ${JWT_SECRET}
      API_URL: ${API_URL:-https://api.civicnotices.co.uk}
      NEW_PUBLISH_FLOW: ${NEW_PUBLISH_FLOW:-true}
      ENABLE_BLUE_NOTICES: ${ENABLE_BLUE_NOTICES:-true}
      ADDRESS_PROVIDER: ${ADDRESS_PROVIDER:-getaddress}
      GETADDRESS_API_KEY: ${GETADDRESS_API_KEY}
      POSTCODES_IO_URL: ${POSTCODES_IO_URL:-https://api.postcodes.io}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./monitoring/logs:/app/monitoring/logs
      - ./monitoring/metrics:/app/monitoring/metrics
      - ./monitoring/reports:/app/monitoring/reports
    networks:
      - civic-network
    depends_on:
      - redis
      - postgres-bouncer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: civic-notices-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - civic-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # PgBouncer for connection pooling
  postgres-bouncer:
    image: edoburu/pgbouncer:latest
    container_name: civic-notices-pgbouncer
    restart: unless-stopped
    environment:
      DATABASES_HOST: ${DB_HOST}
      DATABASES_PORT: ${DB_PORT:-5432}
      DATABASES_DBNAME: ${DB_NAME}
      DATABASES_USER: ${DB_USER}
      DATABASES_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      ADMIN_USERS: ${DB_USER}
    ports:
      - "6432:5432"
    networks:
      - civic-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: civic-notices-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - civic-network
    depends_on:
      - civic-notices
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: civic-notices-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - civic-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: civic-notices-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - civic-network
    depends_on:
      - prometheus

  # Log aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: civic-notices-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - civic-network
    command: -config.file=/etc/loki/local-config.yaml

  # Log shipper - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: civic-notices-promtail
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/civic
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - civic-network
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Backup service
  backup:
    image: postgres:15-alpine
    container_name: civic-notices-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - civic-network
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "while true; do
        echo 'Running backup at $$(date)';
        pg_dump -h $${DB_HOST} -U $${DB_USER} -d $${DB_NAME} | gzip > /backups/civic-$$(date +%Y%m%d-%H%M%S).sql.gz;
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done"

networks:
  civic-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  nginx-cache: