<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Subtle glow ring -->
  <circle cx="8" cy="8" r="12" fill="rgba(59, 130, 246, 0.15)" />
  <!-- Main cursor pointer with shadow -->
  <path d="M2 2 L2 22 L10 16 L14 24 L17 23 L13 15 L22 14 Z"
        fill="white"
        stroke="#1e40af"
        stroke-width="1.5"
        filter="url(#shadow)"/>
  <!-- Shadow definition -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
</svg>
