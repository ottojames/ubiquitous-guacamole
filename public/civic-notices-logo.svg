<svg width="1600" height="400" viewBox="0 0 1600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Civic building/pillar with notification bell representing public notices -->
  <g transform="translate(80, 100)">
    <!-- Building columns representing civic institutions -->
    <rect x="0" y="60" width="30" height="120" rx="4" fill="#223266"/>
    <rect x="45" y="60" width="30" height="120" rx="4" fill="#2f5cc7"/>
    <rect x="90" y="60" width="30" height="120" rx="4" fill="#5687EB"/>

    <!-- Roof/pediment -->
    <path d="M -10 60 L 60 20 L 130 60 Z" fill="#223266"/>

    <!-- Base platform -->
    <rect x="-15" y="180" width="145" height="12" rx="2" fill="#223266"/>

    <!-- Notification bell icon overlay (representing public notices) -->
    <g transform="translate(95, 15)">
      <circle cx="15" cy="15" r="8" fill="#5687EB" opacity="0.2"/>
      <path d="M 15 8 C 12 8 10 10 10 13 L 10 16 C 10 17 9 18 8 19 L 22 19 C 21 18 20 17 20 16 L 20 13 C 20 10 18 8 15 8 Z" fill="#5687EB"/>
      <path d="M 13 20 C 13 21.1 13.9 22 15 22 C 16.1 22 17 21.1 17 20" stroke="#5687EB" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="15" cy="10" r="2" fill="#5687EB"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(280, 0)">
    <!-- "CivicNotices" as one word with gradient from navy to blue -->
    <defs>
      <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#223266;stop-opacity:1" />
        <stop offset="45%" style="stop-color:#223266;stop-opacity:1" />
        <stop offset="55%" style="stop-color:#5687EB;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#5687EB;stop-opacity:1" />
      </linearGradient>
    </defs>
    <text
      x="0"
      y="180"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="120"
      font-weight="900"
      letter-spacing="-3"
      fill="url(#logoGradient)"
    >
      CivicNotices
    </text>

    <!-- Tagline -->
    <text
      x="0"
      y="240"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="32"
      font-weight="500"
      letter-spacing="1"
      fill="#5F6E8B"
    >
      Digital Public Notice Platform
    </text>
  </g>
</svg>
