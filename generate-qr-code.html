<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Notices QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      margin-bottom: 30px;
    }

    #qr-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      display: inline-block;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    #qr-container::before {
      content: '';
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      border-radius: 24px;
      z-index: -1;
    }

    canvas {
      display: block;
      border-radius: 12px;
    }

    .logo-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .logo-text {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .url-display {
      margin-top: 30px;
      padding: 16px 24px;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      color: white;
      border-radius: 12px;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    button {
      margin-top: 30px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
    }

    .instructions {
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Civic Notices QR Code</h1>
    <p>Ultra high-quality QR code for civicnotices.co.uk</p>

    <div id="qr-container">
      <canvas id="qr-canvas"></canvas>
      <div class="logo-overlay">
        <span class="logo-text">CN</span>
      </div>
    </div>

    <div class="url-display">civicnotices.co.uk</div>

    <button onclick="downloadQR()">Download High-Res PNG (2048x2048)</button>

    <p class="instructions">
      Click the button above to download a professional, ultra high-resolution QR code
      perfect for print materials, presentations, or mobile displays. The image is 2048x2048px
      at 300 DPI quality.
    </p>
  </div>

  <script>
    const canvas = document.getElementById('qr-canvas');
    const url = 'https://civicnotices.co.uk';

    // Generate ultra high-quality QR code (2048x2048)
    QRCode.toCanvas(canvas, url, {
      width: 2048,
      margin: 2,
      color: {
        dark: '#0f172a',  // Slate 900
        light: '#ffffff'   // White
      },
      errorCorrectionLevel: 'H'  // Highest error correction
    }, function (error) {
      if (error) console.error(error);
      console.log('QR code generated successfully!');
    });

    function downloadQR() {
      // Create a new canvas for the final branded version
      const finalCanvas = document.createElement('canvas');
      const ctx = finalCanvas.getContext('2d');
      const size = 2048;
      const padding = 80;
      const borderWidth = 8;

      finalCanvas.width = size + (padding * 2);
      finalCanvas.height = size + (padding * 2);

      // Draw gradient border
      const gradient = ctx.createLinearGradient(0, 0, finalCanvas.width, finalCanvas.height);
      gradient.addColorStop(0, '#0ea5e9');
      gradient.addColorStop(1, '#06b6d4');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

      // Draw white background
      ctx.fillStyle = 'white';
      ctx.fillRect(borderWidth, borderWidth,
                   finalCanvas.width - (borderWidth * 2),
                   finalCanvas.height - (borderWidth * 2));

      // Draw QR code
      ctx.drawImage(canvas, padding, padding, size, size);

      // Draw center logo circle
      const centerX = finalCanvas.width / 2;
      const centerY = finalCanvas.height / 2;
      const logoRadius = 80;

      // White circle background
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(centerX, centerY, logoRadius, 0, Math.PI * 2);
      ctx.fill();

      // Add subtle shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, logoRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Draw logo text "CN"
      ctx.font = 'bold 72px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Create gradient for text
      const textGradient = ctx.createLinearGradient(centerX - logoRadius, centerY, centerX + logoRadius, centerY);
      textGradient.addColorStop(0, '#0ea5e9');
      textGradient.addColorStop(1, '#06b6d4');
      ctx.fillStyle = textGradient;
      ctx.fillText('CN', centerX, centerY);

      // Download
      finalCanvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'civicnotices-qr-code-2048px.png';
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      }, 'image/png', 1.0);
    }
  </script>
</body>
</html>
